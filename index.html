<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Administración - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <h2>ResiPortal</h2>
            <p>Inicia sesión para continuar</p>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit" class="btn btn-primary" style="width: 100%">Entrar</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <div id="app" class="hidden">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-building-user"></i>
                    <span>ResiPortal</span>
                </div>
            </div>
            <ul class="nav-links">
                <li class="active" data-view="dashboard"><i class="fa-solid fa-house"></i> <span>Dashboard</span></li>
                <li data-view="porteria"><i class="fa-solid fa-shield-halved"></i> <span>Portería / Visitas</span></li>
                <li data-view="finanzas"><i class="fa-solid fa-money-bill-wave"></i> <span>Finanzas / Cartera</span></li>
                <li data-view="usuarios"><i class="fa-solid fa-users"></i> <span>Usuarios</span></li>
                <li data-view="inmuebles"><i class="fa-solid fa-building"></i> <span>Inmuebles</span></li>
                <li data-view="importar"><i class="fa-solid fa-file-import"></i> <span>Importar Datos</span></li>
                <li data-view="zonas"><i class="fa-solid fa-tree"></i> <span>Zonas Sociales</span></li>
                <li data-view="reclamaciones"><i class="fa-solid fa-clipboard-list"></i> <span>Reclamaciones</span></li>
            </ul>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-ghost"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Salir</span></button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Buscar residentes, inmuebles...">
                </div>
                <div class="user-profile">
                    <div class="notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">0</span>
                    </div>
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=eff6ff&color=3b82f6" alt="User">
                        <span id="topbarName">Cargando...</span>
                    </div>
                </div>
            </header>

            <div class="view-container" id="view-container">
                <!-- Views will be injected here by app.js -->
            </div>
        </main>
    </div>

    <!-- Templates -->
    <template id="tpl-dashboard">
        <div class="view dashboard-view">
            <h1 class="page-title">Resumen del Conjunto</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--primary-light); color: var(--primary)"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-info">
                        <h3>Residentes</h3>
                        <p class="stat-number">342</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #dcfce7; color: #16a34a"><i class="fa-solid fa-building"></i></div>
                    <div class="stat-info">
                        <h3>Apartamentos</h3>
                        <p class="stat-number">120</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fee2e2; color: #dc2626"><i class="fa-solid fa-money-bill-wave"></i></div>
                    <div class="stat-info">
                        <h3>Cartera (Mora)</h3>
                        <p class="stat-number">$1.2M</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fef3c7; color: #d97706"><i class="fa-solid fa-shield-halved"></i></div>
                    <div class="stat-info">
                        <h3>Visitas Hoy</h3>
                        <p class="stat-number">18</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-finanzas">
        <div class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h1 class="page-title" style="margin:0">Finanzas y Cartera</h1>
                <div>
                    <button class="btn btn-primary" style="margin-right:8px;" onclick="document.getElementById('modalCobro').classList.remove('hidden')"><i class="fa-solid fa-file-invoice-dollar"></i> Generar Cobro Masivo</button>
                    <button class="btn btn-primary" style="background:#16a34a" onclick="document.getElementById('modalPago').classList.remove('hidden')"><i class="fa-solid fa-hand-holding-dollar"></i> Registrar Pago</button>
                </div>
            </div>

            <!-- Modales Ocultos (Demo simple inline) -->
            <div id="modalCobro" class="card hidden" style="margin-bottom:24px; border:2px solid var(--primary)">
                <h3>Generar Cobro Masivo (Administración)</h3>
                <form id="formGenerarCobro" style="display:flex; gap:16px; margin-top:16px;">
                    <input type="number" id="cobroValor" placeholder="Valor ($)" required style="padding:8px; border-radius:4px; border:1px solid #ccc;">
                    <input type="number" id="cobroMes" placeholder="Mes (1-12)" required style="padding:8px; border-radius:4px; border:1px solid #ccc;">
                    <input type="number" id="cobroAnio" placeholder="Año" required style="padding:8px; border-radius:4px; border:1px solid #ccc;">
                    <button type="submit" class="btn btn-primary">Ejecutar Cobro</button>
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('modalCobro').classList.add('hidden')">Cancelar</button>
                </form>
            </div>

            <div id="modalPago" class="card hidden" style="margin-bottom:24px; border:2px solid #16a34a">
                <h3>Registrar Pago de Inmueble</h3>
                <form id="formRegistrarPago" style="display:flex; gap:16px; margin-top:16px;">
                    <input type="number" id="pagoInmuebleId" placeholder="ID Inmueble" required style="padding:8px; border-radius:4px; border:1px solid #ccc;">
                    <input type="number" id="pagoValor" placeholder="Valor ($)" required style="padding:8px; border-radius:4px; border:1px solid #ccc;">
                    <select id="pagoMetodo" style="padding:8px; border-radius:4px; border:1px solid #ccc;">
                        <option value="transferencia">Transferencia</option>
                        <option value="efectivo">Efectivo</option>
                    </select>
                    <button type="submit" class="btn btn-primary" style="background:#16a34a">Registrar</button>
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('modalPago').classList.add('hidden')">Cancelar</button>
                </form>
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
                <div>
                    <h3>Cartera Activa (Mora)</h3>
                    <div class="card">
                        <table class="data-table">
                            <thead><tr><th>ID</th><th>Apto</th><th>Mora Actual</th></tr></thead>
                            <tbody id="tb-cartera"><tr><td colspan="3">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <h3>Últimos Pagos Recibidos</h3>
                    <div class="card">
                        <table class="data-table">
                            <thead><tr><th>Apto</th><th>Valor</th><th>Método</th><th>Fecha</th></tr></thead>
                            <tbody id="tb-pagos"><tr><td colspan="4">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-porteria">
        <div class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h1 class="page-title" style="margin:0">Portería y Seguridad</h1>
                <div>
                    <button class="btn btn-primary" style="margin-right:8px;"><i class="fa-solid fa-person-walking-arrow-right"></i> Registrar Visita</button>
                    <button class="btn btn-primary" style="background:#16a34a"><i class="fa-solid fa-box"></i> Recibir Paquete</button>
                </div>
            </div>
            
            <h3>Visitas Recientes</h3>
            <div class="card" style="margin-bottom: 24px;">
                <table class="data-table">
                    <thead><tr><th>Visitante</th><th>Apto Destino</th><th>Placa</th><th>Ingreso</th><th>Salida</th></tr></thead>
                    <tbody id="tb-visitantes"><tr><td colspan="5">Cargando...</td></tr></tbody>
                </table>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
                <div>
                    <h3>Paquetes Pendientes</h3>
                    <div class="card">
                        <table class="data-table">
                            <thead><tr><th>Transportadora</th><th>Apto</th><th>Fecha</th><th>Estado</th></tr></thead>
                            <tbody id="tb-paquetes"><tr><td colspan="4">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <h3>Minuta (Novedades)</h3>
                    <div class="card">
                        <table class="data-table">
                            <thead><tr><th>Fecha</th><th>Vigilante</th><th>Asunto</th></tr></thead>
                            <tbody id="tb-minuta"><tr><td colspan="3">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-usuarios">
        <div class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h1 class="page-title" style="margin:0">Usuarios</h1>
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> Nuevo Usuario</button>
            </div>
            <div class="card">
                <table class="data-table">
                    <thead><tr><th>Documento</th><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead>
                    <tbody id="tb-usuarios"><tr><td colspan="4">Cargando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-inmuebles">
        <div class="view">
            <h1 class="page-title">Inmuebles y Estados de Cuenta</h1>
            <div class="card">
                <table class="data-table">
                    <thead><tr><th>Torre</th><th>Apto</th><th>Mora Actual</th><th>Vehículos</th><th>Mascotas</th></tr></thead>
                    <tbody id="tb-inmuebles"><tr><td colspan="5">Cargando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-zonas">
        <div class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h1 class="page-title" style="margin:0">Zonas Sociales y Reservas</h1>
                <button class="btn btn-primary"><i class="fa-solid fa-calendar-plus"></i> Nueva Reserva</button>
            </div>
            <div class="card">
                <table class="data-table">
                    <thead><tr><th>Zona</th><th>Usuario</th><th>Fecha</th><th>Estado</th></tr></thead>
                    <tbody id="tb-zonas"><tr><td colspan="4">Cargando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-reclamaciones">
        <div class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h1 class="page-title" style="margin:0">PQRS (Reclamaciones)</h1>
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> Radicar Queja</button>
            </div>
            <div class="card">
                <table class="data-table">
                    <thead><tr><th>Asunto</th><th>Usuario</th><th>Fecha</th><th>Estado</th></tr></thead>
                    <tbody id="tb-reclamaciones"><tr><td colspan="4">Cargando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tpl-importar">
        <div class="view import-view">
            <h1 class="page-title">Importar Base de Datos</h1>
            <div class="card">
                <p>Sube tu archivo Excel para cargar residentes o propietarios de forma masiva. El sistema leerá las columnas para que puedas mapearlas correctamente.</p>
                
                <div class="upload-zone" id="uploadZone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <h3>Arrastra tu archivo Excel aquí</h3>
                    <p>o</p>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" hidden>
                    <button class="btn btn-primary" onclick="document.getElementById('excelFile').click()">Seleccionar Archivo</button>
                </div>

                <div id="mappingSection" class="hidden">
                    <hr>
                    <h3>Asignar Columnas</h3>
                    <p>Relaciona las columnas de tu Excel con los campos del sistema:</p>
                    <form id="mappingForm" class="mapping-grid">
                        <!-- Selects will be generated here -->
                    </form>
                    <div class="actions mt-4">
                        <button class="btn btn-primary" id="btnProcesarImportacion">Procesar Importación</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
